<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard - Gliimu</title>
  <script>
    (function() {
      const hit = document.cookie.match(/(?:^|;\s*)gliimu-theme=([^;]*)/);
      const saved = (hit && hit[1]) || localStorage.getItem('gliimu-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="icon" type="image/png" href="/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Absolute paths starting with / so assets resolve under any clean-URL route -->
  <link rel="stylesheet" href="/shared/css/design-system.css?v=9">
  <link rel="stylesheet" href="/dashboard/assets/css/dashboard.css?v=95">
  <link rel="stylesheet" href="/dashboard/assets/css/views/profile.css?v=16">
  <link rel="stylesheet" href="/dashboard/assets/css/views/gliims.css?v=88">
  <link rel="stylesheet" href="/dashboard/assets/css/views/settings.css?v=5">
  <link rel="stylesheet" href="/dashboard/assets/css/views/ping.css?v=51">
  <link rel="stylesheet" href="/dashboard/assets/css/views/live.css?v=32">
  <link rel="stylesheet" href="/dashboard/assets/css/views/billing.css?v=5">
  <link rel="stylesheet" href="/dashboard/assets/css/views/xplore.css?v=97">
  <link rel="stylesheet" href="/dashboard/assets/css/views/search.css?v=11">
  <link rel="stylesheet" href="/dashboard/assets/css/views/reader.css?v=29">
  <link rel="stylesheet" href="/dashboard/assets/css/views/assistant.css?v=30">
  <link rel="stylesheet" href="/dashboard/assets/css/views/support.css?v=36">
  <link rel="stylesheet" href="/dashboard/assets/css/views/alerts.css?v=10">
  <link rel="stylesheet" href="/dashboard/assets/css/views/collection.css?v=6">

  <!-- Branded dialogs; must load before anything that can call alert/confirm/prompt -->
  <script src="/shared/js/dialog.js?v=2"></script>
</head>
<body>

  <div class="dashboard-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a href="/xplore" class="brand-logo" title="Gliimu" aria-label="Gliimu home">
            <img src="/icons/icon.png" alt="Gliimu" class="brand-logo-img">
            <span class="brand-word">liimu</span>
          </a>
        </div>

        <div class="rail-people" id="rail-people" aria-label="Team"></div>

        <div class="sidebar-account">
          <button type="button" class="nav-item nav-item--account" data-account-trigger aria-haspopup="menu" aria-expanded="false" title="Your account">
            <span class="nav-avatar">
              <img class="nav-avatar-img" data-user-avatar src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F1F5F9'/%3E%3C/svg%3E" alt="">
              <span class="unread-dot" data-dot="any" hidden></span>
            </span>
            <span class="nav-text">You</span>
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="topbar">
          <div id="topbar-dynamic-content" style="flex: 1; display: flex; justify-content: center; padding: 0 16px;"></div>
          <div id="topbar-right-actions" style="display: flex; align-items: center; gap: 8px; margin-left: auto;"></div>
        </header>

        <div class="view-container" id="app">
          <!-- Views will be injected here -->
        </div>
      </main>

      <nav class="bottom-bar" id="bottom-bar" aria-label="Main">
        <button type="button" class="bottom-item bottom-item--team" data-team-trigger aria-haspopup="true" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span class="bottom-label">Team</span>
        </button>
        <a href="/xplore" class="bottom-item bottom-item--home" data-route="xplore">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
          <span class="bottom-label">XpLoRe</span>
        </a>
        <button type="button" class="bottom-item bottom-item--account" data-account-trigger aria-haspopup="menu" aria-expanded="false">
          <span class="nav-avatar nav-avatar--sm">
            <img class="nav-avatar-img" data-user-avatar src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F1F5F9'/%3E%3C/svg%3E" alt="">
            <span class="unread-dot" data-dot="any" hidden></span>
          </span>
          <span class="bottom-label">You</span>
        </button>
      </nav>
  </div>

  <!-- Use absolute paths for JS as well -->
  <script src="/shared/js/theme.js?v=3"></script>
  <script src="https://unpkg.com/@daily-co/daily-js@0.94.0"></script>
  <script type="module" src="/dashboard/assets/js/app.js?v=255"></script>
</body>
</html>
