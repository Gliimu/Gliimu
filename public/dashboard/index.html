<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Gliimu</title>
  <script>
    (function() {
      const saved = localStorage.getItem('gliimu-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="icon" type="image/png" href="/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Use absolute paths starting with / to prevent Vercel routing issues -->
  <link rel="stylesheet" href="/shared/css/design-system.css">
  <link rel="stylesheet" href="/dashboard/assets/css/dashboard.css">
  <link rel="stylesheet" href="/dashboard/assets/css/views/portfolio.css">
  <link rel="stylesheet" href="/dashboard/assets/css/views/hub.css?v=2">
  <link rel="stylesheet" href="/dashboard/assets/css/views/settings.css">
  <link rel="stylesheet" href="/dashboard/assets/css/views/applications.css">
  <link rel="stylesheet" href="/dashboard/assets/css/views/messages.css">
  <link rel="stylesheet" href="/dashboard/assets/css/views/live.css">
  <link rel="stylesheet" href="/dashboard/assets/css/views/wallet.css">
  <link rel="stylesheet" href="/dashboard/assets/css/views/library.css?v=3">
  <link rel="stylesheet" href="/dashboard/assets/css/views/assistant.css">
  <link rel="stylesheet" href="/dashboard/assets/css/views/debates.css">

  <!-- Branded dialogs; must load before anything that can call alert/confirm/prompt -->
  <script src="/shared/js/dialog.js?v=1"></script>
</head>
<body>

  <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a href="https://gliimu.com" class="brand-logo">
            <img src="/icons/icon.png" alt="Gliimu Logo" class="brand-logo-img">
          </a>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section">
            <span class="nav-label">Main</span>
            <a href="#/assistant" class="nav-item" data-route="assistant" title="Gliim P.A.">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"></rect><path d="M12 8V4"></path><circle cx="12" cy="3" r="1"></circle><path d="M9 13h.01"></path><path d="M15 13h.01"></path><path d="M9.5 16.5h5"></path></svg>
              <span class="nav-text">Gliim P.A.</span>
            </a>
            <a href="#/library" class="nav-item" data-route="library" title="Hub">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
              <span class="nav-text">Hub</span>
            </a>
            <a href="#/ping" class="nav-item" data-route="ping" title="Ping">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span class="nav-text">Ping</span>
            </a>
            <a href="#/hub" class="nav-item" data-route="hub" title="Argue">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"></path><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"></path></svg>
              <span class="nav-text">Argue</span>
            </a>
          </div>

          <div class="nav-section">
            <span class="nav-label">Account</span>
            <a href="#/applications" class="nav-item" data-route="applications" title="Queue">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                <span class="nav-text">Queue</span>
              </a>
            <a href="#/wallet" class="nav-item" data-route="wallet" title="Billing">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
              <span class="nav-text">Billing</span>
            </a>
            <a href="#/settings" class="nav-item" data-route="settings" title="Settings">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              <span class="nav-text">Settings</span>
            </a>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="user-card">
            <div style="position: relative; cursor: pointer;" onclick="window.location.hash='#/profile'; toggleSidebarOnMobileNav();">
              <img id="user-avatar" class="user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F1F5F9'/%3E%3C/svg%3E" alt="Avatar">
            </div>
            <div class="user-info">
              <span class="user-name" id="user-name">Loading...</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="topbar">
          <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
            <img src="/icons/in.svg" class="sidebar-toggle-icon" id="sidebar-icon-in" alt="Expand sidebar">
            <img src="/icons/out.svg" class="sidebar-toggle-icon" id="sidebar-icon-out" alt="Collapse sidebar" style="display:none;">
          </button>
          <a href="https://gliimu.com" class="topbar-logo-link"><img src="/icons/logo.png" alt="Gliimu" class="topbar-logo-img"></a>
          <div id="topbar-dynamic-content" style="flex: 1; display: flex; justify-content: center; padding: 0 16px;"></div>
          <div id="topbar-right-actions" style="display: flex; align-items: center; gap: 8px; margin-left: auto;"></div>
        </header>

      <div class="view-container" id="app">
        <!-- Views will be injected here -->
      </div>
    </main>
  </div>

  <!-- Use absolute paths for JS as well -->
  <script src="/shared/js/theme.js"></script>
  <script type="module" src="/dashboard/assets/js/app.js?v=3"></script>

  <script>
    function toggleSidebar() {
      // Mobile: slide the drawer in/out. Desktop: collapse to an icon rail.
      if (window.innerWidth <= 768) {
        document.body.classList.toggle('sidebar-open');
      } else {
        const collapsed = document.body.classList.toggle('sidebar-collapsed');
        localStorage.setItem('gliimu-sidebar-collapsed', collapsed ? '1' : '0');
      }
      updateSidebarToggleIcon();
    }

    // Mobile: closed drawer shows in.svg (invites opening), open drawer shows out.svg.
    // Desktop: in.svg invites expanding the rail; out.svg invites collapsing it.
    function updateSidebarToggleIcon() {
      const inIcon = document.getElementById('sidebar-icon-in');
      const outIcon = document.getElementById('sidebar-icon-out');
      if (!inIcon || !outIcon) return;
      if (window.innerWidth <= 768) {
        const open = document.body.classList.contains('sidebar-open');
        inIcon.style.display = open ? 'none' : '';
        outIcon.style.display = open ? '' : 'none';
        return;
      }
      const collapsed = document.body.classList.contains('sidebar-collapsed');
      inIcon.style.display = collapsed ? '' : 'none';
      outIcon.style.display = collapsed ? 'none' : '';
    }

    // Close the mobile sidebar right away when something inside it is used
    function toggleSidebarOnMobileNav() {
      if (window.innerWidth <= 768) {
        document.body.classList.remove('sidebar-open');
        updateSidebarToggleIcon();
      }
    }

    // Restore the desktop rail state before paint to avoid a flash
    if (localStorage.getItem('gliimu-sidebar-collapsed') === '1') {
      document.body.classList.add('sidebar-collapsed');
    }
    updateSidebarToggleIcon();
    window.addEventListener('resize', updateSidebarToggleIcon);
  </script>
</body>
</html>
