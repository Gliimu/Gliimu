<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Gliimu</title>
  <script>
    (function() {
      const saved = localStorage.getItem('gliimu-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <!-- Logo Image -->
        <a href="/dashboard/index.html" class="brand-logo">
          <img src="/icons/logo.png" alt="Gliimu Logo" class="brand-logo-img">
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-label">Main</span>
          <a href="#/hub" class="nav-item" data-route="hub">Hub</a>
          <a href="#/library" class="nav-item" data-route="library">Library</a>
          <a href="#/portfolio" class="nav-item" data-route="portfolio">Portfolio</a>
          <a href="#/applications" class="nav-item" data-route="applications">Applications</a>
        </div>

        <div class="nav-section">
          <span class="nav-label">Account</span>
          <a href="#/messages" class="nav-item" data-route="messages">Messages</a>
          <a href="#/wallet" class="nav-item" data-route="wallet">Wallet</a>
          <a href="#/settings" class="nav-item" data-route="settings">Settings</a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <!-- Fixed Avatar Image -->
          <img id="user-avatar" class="user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F1F5F9'/%3E%3C/svg%3E" alt="Avatar">
          <div class="user-info">
            <span class="user-name" id="user-name">Loading...</span>
            <span class="user-role">Gliimait</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <button class="menu-toggle" onclick="document.body.classList.toggle('sidebar-open')">☰</button>
        <div class="topbar-title" id="page-title">Dashboard</div>

        <!-- Icon Theme Toggle -->
        <button class="theme-toggle-btn" id="theme-icon-btn" onclick="toggleTheme()">
          <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg id="moon-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </header>

      <div class="view-container" id="app">
        <!-- Views will be injected here -->
      </div>
    </main>
  </div>

  <script src="../shared/js/theme.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
