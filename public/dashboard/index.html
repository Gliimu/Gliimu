<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Gliimu</title>
  <script>
    (function() {
      const saved = localStorage.getItem('gliimu-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="icon" type="image/png" href="/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Use absolute paths starting with / to prevent Vercel routing issues -->
  <link rel="stylesheet" href="/shared/css/design-system.css?v=9">
  <link rel="stylesheet" href="/dashboard/assets/css/dashboard.css?v=60">
  <link rel="stylesheet" href="/dashboard/assets/css/views/profile.css?v=6">
  <link rel="stylesheet" href="/dashboard/assets/css/views/feed-gliims.css?v=65">
  <link rel="stylesheet" href="/dashboard/assets/css/views/settings.css?v=2">
  <link rel="stylesheet" href="/dashboard/assets/css/views/ping.css?v=42">
  <link rel="stylesheet" href="/dashboard/assets/css/views/live.css?v=5">
  <link rel="stylesheet" href="/dashboard/assets/css/views/wallet.css?v=3">
  <link rel="stylesheet" href="/dashboard/assets/css/views/feed.css?v=63">
  <link rel="stylesheet" href="/dashboard/assets/css/views/feature.css?v=1">
  <link rel="stylesheet" href="/dashboard/assets/css/views/reader.css?v=23">
  <link rel="stylesheet" href="/dashboard/assets/css/views/assistant.css?v=30">
  <link rel="stylesheet" href="/dashboard/assets/css/views/post-read.css?v=1">
  <link rel="stylesheet" href="/dashboard/assets/css/views/support.css?v=35">
  <link rel="stylesheet" href="/dashboard/assets/css/views/alerts.css?v=9">
  <link rel="stylesheet" href="/dashboard/assets/css/views/collection.css?v=6">
  <link rel="stylesheet" href="/dashboard/assets/css/views/search.css?v=8">

  <!-- Branded dialogs; must load before anything that can call alert/confirm/prompt -->
  <script src="/shared/js/dialog.js?v=1"></script>
</head>
<body>

  <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a href="https://gliimu.com" class="brand-logo">
            <img src="/icons/logo.png" alt="Gliimu" class="brand-logo-img brand-logo-rect">
            <img src="/icons/icon.png" alt="Gliimu" class="brand-logo-img brand-logo-square">
          </a>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section">
            <a href="#/xplore" class="nav-item" data-route="xplore" title="XpLoRe">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
              <span class="nav-text">XpLoRe</span>
            </a>
            <a href="#/search" class="nav-item" data-route="search" title="Search">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <span class="nav-text">Search</span>
            </a>
            <a href="#/ping" class="nav-item" data-route="ping" title="Ping">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span class="nav-text">Ping</span>
            </a>
            <a href="#/live" class="nav-item" data-route="live" title="Live">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
              <span class="nav-text">Live</span>
            </a>
            <a href="#/alerts" class="nav-item" data-route="alerts" title="Alerts">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
              <span class="nav-text">Alerts</span>
            </a>
            <a href="#/wallet" class="nav-item" data-route="wallet" title="Billing">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
              <span class="nav-text">Billing</span>
            </a>
            <a href="#/settings" class="nav-item" data-route="settings" title="Settings">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              <span class="nav-text">Settings</span>
            </a>
          </div>

          <div class="nav-section nav-section-bottom">
            <a href="#/publish" class="nav-item" data-route="publish" title="Publish">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              <span class="nav-text">Publish</span>
            </a>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="user-card">
            <div style="position: relative; cursor: pointer;" onclick="window.location.hash='#/profile'; toggleSidebarOnMobileNav();">
              <img id="user-avatar" class="user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F1F5F9'/%3E%3C/svg%3E" alt="Avatar">
            </div>
            <div class="user-info">
              <span class="user-name" id="user-name">Loading...</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="topbar">
          <a href="https://gliimu.com" class="topbar-logo-link"><img src="/icons/logo.png" alt="Gliimu" class="topbar-logo-img"></a>
          <div id="topbar-dynamic-content" style="flex: 1; display: flex; justify-content: center; padding: 0 16px;"></div>
          <div id="topbar-right-actions" style="display: flex; align-items: center; gap: 8px; margin-left: auto;"></div>
        </header>

        <div class="view-container" id="app">
          <!-- Views will be injected here -->
        </div>
      </main>

      <!-- Floating draggable menu toggle -->
      <button class="floating-menu-btn" id="floating-menu-btn" aria-label="Toggle menu">
        <img src="/icons/menu.svg" alt="Menu">
      </button>

      <!-- Backdrop overlay for sidebar -->
      <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>
  </div>

  <!-- Use absolute paths for JS as well -->
  <script src="/shared/js/theme.js"></script>
  <script type="module" src="/dashboard/assets/js/app.js?v=95"></script>

  <script>
    function toggleSidebar() {
      document.body.classList.toggle('sidebar-open');
    }

    function toggleSidebarOnMobileNav() {
      document.body.classList.remove('sidebar-open');
    }
  </script>
</body>
</html>
