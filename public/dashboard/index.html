<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Gliimu</title>
  <script>
    (function() {
      const saved = localStorage.getItem('gliimu-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Fixed Paths -->
  <link rel="stylesheet" href="../shared/css/design-system.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="/dashboard/index.html" class="brand-logo">Gliimu</a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-label">Main</span>
          <a href="#/hub" class="nav-item" data-route="hub">Hub</a>
          <a href="#/library" class="nav-item" data-route="library">Library</a>
          <a href="#/portfolio" class="nav-item" data-route="portfolio">Portfolio</a>
          <a href="#/applications" class="nav-item" data-route="applications">Applications</a>
        </div>

        <div class="nav-section">
          <span class="nav-label">Account</span>
          <a href="#/messages" class="nav-item" data-route="messages">Messages</a>
          <a href="#/wallet" class="nav-item" data-route="wallet">Wallet</a>
          <a href="#/settings" class="nav-item" data-route="settings">Settings</a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar" id="user-avatar">G</div>
          <div class="user-info">
            <span class="user-name" id="user-name">Loading...</span>
            <span class="user-role">Gliimait</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <button class="menu-toggle" onclick="document.body.classList.toggle('sidebar-open')">☰</button>
        <div class="topbar-title" id="page-title">Dashboard</div>
        <button class="theme-toggle-btn" onclick="toggleTheme()">Toggle Theme</button>
      </header>

      <div class="view-container" id="app">
        <!-- Views will be injected here -->
      </div>
    </main>
  </div>

  <!-- Fixed Paths -->
  <script src="../shared/js/theme.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
