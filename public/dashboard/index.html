<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Gliimu</title>
  <script>
    (function() {
      const saved = localStorage.getItem('gliimu-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="icon" type="image/png" href="/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Use absolute paths starting with / to prevent Vercel routing issues -->
  <link rel="stylesheet" href="/shared/css/design-system.css?v=9">
  <link rel="stylesheet" href="/dashboard/assets/css/dashboard.css?v=69">
  <link rel="stylesheet" href="/dashboard/assets/css/views/profile.css?v=15">
  <link rel="stylesheet" href="/dashboard/assets/css/views/feed-gliims.css?v=75">
  <link rel="stylesheet" href="/dashboard/assets/css/views/settings.css?v=5">
  <link rel="stylesheet" href="/dashboard/assets/css/views/ping.css?v=50">
  <link rel="stylesheet" href="/dashboard/assets/css/views/live.css?v=24">
  <link rel="stylesheet" href="/dashboard/assets/css/views/wallet.css?v=3">
  <link rel="stylesheet" href="/dashboard/assets/css/views/feed.css?v=80">
  <link rel="stylesheet" href="/dashboard/assets/css/views/reader.css?v=23">
  <link rel="stylesheet" href="/dashboard/assets/css/views/assistant.css?v=30">
  <link rel="stylesheet" href="/dashboard/assets/css/views/post-read.css?v=18">
  <link rel="stylesheet" href="/dashboard/assets/css/views/support.css?v=35">
  <link rel="stylesheet" href="/dashboard/assets/css/views/alerts.css?v=9">
  <link rel="stylesheet" href="/dashboard/assets/css/views/collection.css?v=6">

  <!-- Branded dialogs; must load before anything that can call alert/confirm/prompt -->
  <script src="/shared/js/dialog.js?v=2"></script>
</head>
<body>

  <div class="dashboard-layout">
      <!-- The rail carries the five places you can get lost in, with XpLoRe in
           the middle, plus the faces of the people you follow. -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a href="https://gliimu.com" class="brand-logo">
            <img src="/icons/logo.png" alt="Gliimu" class="brand-logo-img brand-logo-rect">
            <img src="/icons/icon.png" alt="Gliimu" class="brand-logo-img brand-logo-square">
          </a>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section">
            <a href="#/ping" class="nav-item" data-route="ping" title="Ping">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span class="nav-text">Ping</span>
              <span class="unread-dot" data-dot="ping" hidden></span>
            </a>
            <a href="#/publish" class="nav-item" data-route="publish" title="Publish">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              <span class="nav-text">Publish</span>
            </a>
            <a href="#/xplore" class="nav-item" data-route="xplore" title="XpLoRe">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
              <span class="nav-text">XpLoRe</span>
            </a>
            <a href="#/live" class="nav-item" data-route="live" title="Live">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"></path></svg>
              <span class="nav-text">Live</span>
            </a>
            <a href="#/wallet" class="nav-item" data-route="wallet" title="Billing">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
              <span class="nav-text">Billing</span>
            </a>
          </div>
        </nav>

        <div class="rail-people" id="rail-people" aria-label="People you follow"></div>

        <button type="button" class="rail-toggle" id="rail-toggle" aria-expanded="false" aria-label="Expand menu" onclick="toggleSidebar()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M29,16c0,1.104-0.896,2-2,2H11c-1.104,0-2-0.896-2-2s0.896-2,2-2h16C28.104,14,29,14.896,29,16z"></path><path d="M29,6c0,1.104-0.896,2-2,2H11C9.896,8,9,7.104,9,6s0.896-2,2-2h16C28.104,4,29,4.896,29,6z"></path><path d="M29,26c0,1.104-0.896,2-2,2H11c-1.104,0-2-0.896-2-2s0.896-2,2-2h16C28.104,24,29,24.896,29,26z"></path><path d="M3,6c0,1.103,0.897,2,2,2s2-0.897,2-2S6.103,4,5,4S3,4.897,3,6z"></path><path d="M3,16c0,1.103,0.897,2,2,2s2-0.897,2-2s-0.897-2-2-2S3,14.897,3,16z"></path><path d="M3,26c0,1.103,0.897,2,2,2s2-0.897,2-2s-0.897-2-2-2S3,24.897,3,26z"></path></svg>
          <span class="rail-toggle-label">Collapse</span>
        </button>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="topbar">
          <a href="https://gliimu.com" class="topbar-logo-link"><img src="/icons/logo.png" alt="Gliimu" class="topbar-logo-img"></a>
          <div id="topbar-dynamic-content" style="flex: 1; display: flex; justify-content: center; padding: 0 16px;"></div>
          <div id="topbar-right-actions" style="display: flex; align-items: center; gap: 8px; margin-left: auto;"></div>
        </header>

        <div class="view-container" id="app">
          <!-- Views will be injected here -->
        </div>
      </main>

      <!-- Narrow screens have no sidebar, so this bar is the whole navigation.
           Five icons, with XpLoRe in the middle. -->
      <nav class="bottom-bar" id="bottom-bar" aria-label="Main">
        <a href="#/ping" class="bottom-item" data-route="ping" title="Ping" aria-label="Ping">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span class="unread-dot" data-dot="ping" hidden></span>
        </a>
        <a href="#/publish" class="bottom-item" data-route="publish" title="Publish" aria-label="Publish">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </a>
        <a href="#/xplore" class="bottom-item" data-route="xplore" title="XpLoRe" aria-label="XpLoRe">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
        </a>
        <a href="#/live" class="bottom-item" data-route="live" title="Live" aria-label="Live">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"></path></svg>
        </a>
        <a href="#/wallet" class="bottom-item" data-route="wallet" title="Billing" aria-label="Billing">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
        </a>
      </nav>
  </div>

  <!-- Use absolute paths for JS as well -->
  <script src="/shared/js/theme.js"></script>
  <script src="https://unpkg.com/@daily-co/daily-js@0.94.0"></script>
  <script type="module" src="/dashboard/assets/js/app.js?v=196"></script>

  <script>
    function toggleSidebar() {
      const open = document.body.classList.toggle('sidebar-open');
      const toggle = document.getElementById('rail-toggle');
      if (toggle) {
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Collapse menu' : 'Expand menu');
      }
    }
  </script>
</body>
</html>
