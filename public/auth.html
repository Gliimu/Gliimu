<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - Gliimu</title>
  <!-- Prevent FOUC -->
  <script>
    (function() {
      const saved = localStorage.getItem('gliimu-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CHANGED: Removed /public/ from paths -->
  <link rel="stylesheet" href="shared/css/design-system.css">
  <link rel="stylesheet" href="assets/css/public.css">
</head>
<body>

  <div class="auth-container">
    <!-- Left Side: Brand/Marketing -->
    <div class="auth-brand-panel">
      <div class="brand-logo">Gliimu</div>
      <h1>Become a <span class="gradient-text">Full Stack Media Architect</span></h1>
      <p>Join an elite guild of creators, developers, and business minds. Learn at your own pace, build real-world projects, and step into financial independence.</p>
      <button class="theme-toggle-btn" onclick="toggleTheme()">
        Toggle Theme
      </button>
    </div>

    <!-- Right Side: Forms -->
    <div class="auth-form-panel">
      <div class="auth-card">
        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Log In</button>
          <button class="auth-tab" data-tab="join">Join Us</button>
        </div>

        <!-- Log In View -->
        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" class="input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="input" placeholder="Enter your password" required>
          </div>
          <div class="form-footer">
            <a href="/forgot-password.html" class="link-muted">Forgot password?</a>
          </div>
          <button type="submit" class="btn-primary w-full">Log In to Dashboard</button>
        </form>

        <!-- Join Us View -->
        <form id="join-form" class="auth-form">
          <div class="form-group">
            <label for="join-name">Full Name</label>
            <input type="text" id="join-name" class="input" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="join-email">Email Address</label>
            <input type="email" id="join-email" class="input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="join-password">Create Password</label>
            <input type="password" id="join-password" class="input" placeholder="Min. 8 characters" required>
          </div>
          <button type="submit" class="btn-primary w-full">Create Gliimait Account</button>
          <p class="auth-disclaimer">By signing up, you agree to our Terms of Service and Privacy Policy.</p>
        </form>
      </div>
    </div>
  </div>

  <!-- CHANGED: Removed /public/ from paths -->
  <script src="shared/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
