<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gliimu - Ideas that Inspire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Master video production, design, AND code. Become a Full Stack Media Architect. Real projects, real portfolio, real independence." />
  <link rel="icon" type="image/png" href="/icons/icon.png">

  <script>
    (function() {
      const saved = localStorage.getItem('gliimu-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="/shared/css/design-system.css?v=9">
  <link rel="stylesheet" href="/assets/css/public.css?v=64">

  <!-- Branded dialogs; must load before anything that can call alert/confirm/prompt -->
  <script src="/shared/js/dialog.js?v=2"></script>
</head>
<body>

  <!-- Entry splash: the session check runs behind this cover, so a signed-in
       visitor is handed to the dashboard before any marketing content paints. -->
  <div id="entry-splash" class="entry-splash" role="status" aria-label="Loading Gliimu">
    <img src="/icons/icon.png" alt="">
    <span class="entry-splash-dots"><span></span><span></span><span></span></span>
  </div>

  <!-- The whole page is one screen, so this bar is its only chrome: the menu on
       the left edge, the wordmark beside it, Enter on the right edge. What the
       footer used to carry now opens from the menu. -->
  <header class="site-bar">
    <div class="site-bar-start">
      <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="site-menu" aria-label="Menu">
        <svg class="menu-open-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
        <svg class="menu-close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <a class="brand-mark" href="/" aria-label="Gliimu">
        <img src="/icons/icon.png" alt="">
        <span class="brand-word">liimu</span>
      </a>
    </div>

    <nav class="site-menu" id="site-menu" aria-label="Site" hidden>
      <button type="button" data-site-action="faq">FAQs</button>
      <button type="button" data-site-action="contact">Contact</button>
      <button type="button" data-auth-sheet data-auth-terms>Terms</button>
    </nav>

    <a href="/auth.html?tab=login" class="btn-primary btn-sm js-join-link site-enter" data-auth-sheet data-auth-tab="login">
      <span>Enter</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>
  </header>

  <!-- HERO -->
  <main class="hero" id="hero-section">
    <!-- The explainer. Operations uploads it and anyone can watch it, signed in
         or not. Nothing autoplays and nothing is bundled as a stand-in: a
         browser only allows sound after a click, so the click is the design. -->
    <video id="hero-video" class="hero-video" playsinline webkit-playsinline preload="metadata"></video>
    <button type="button" class="hero-play" id="hero-play" hidden aria-label="Play the Gliimu film">
      <svg class="hero-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.4v13.2L19 12z" fill="currentColor"></path></svg>
      <svg class="hero-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.3v14H7zm6.7 0H17v14h-3.3z" fill="currentColor"></path></svg>
    </button>
    <div class="hero-scrim" aria-hidden="true"></div>

    <div class="container hero-inner">
      <h1 class="hero-title">
        <span id="hero-title-text"></span><span class="highlight" id="hero-highlight-text"></span>
      </h1>
      <p class="hero-desc" id="hero-desc-text"></p>
    </div>

    <!-- The one record the page keeps of itself, centred on the bottom edge. -->
    <p class="hero-copyright" id="copyright-text"></p>

  </main>

  <!-- AUTH SHEET — sign in and join without leaving the page.
       The frame is the real /auth.html, so there is exactly one password
       form, one recovery flow and one set of terms in the whole product.
       It stays empty until the first tap asks for it. -->
  <div class="auth-sheet" id="auth-sheet" hidden>
    <div class="auth-sheet-backdrop" data-auth-sheet-close></div>
    <div class="auth-sheet-panel" role="dialog" aria-modal="true" aria-label="Sign in to Gliimu">
      <button type="button" class="auth-sheet-close" data-auth-sheet-close aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <iframe class="auth-sheet-frame" id="auth-sheet-frame" title="Sign in to Gliimu"></iframe>
    </div>
  </div>

  <!-- FAQ MODAL -->
  <div class="modal-overlay" id="faq-modal" style="display: none;">
    <div class="modal-content modal-lg">
      <button class="modal-close" onclick="document.getElementById('faq-modal').style.display='none'">&times;</button>
      <h2 class="modal-title">Frequently Asked Questions</h2>
      <p class="modal-subtitle">Everything you need to know about Gliimu.</p>
      <div class="faq-accordion-container" id="faq-accordion"></div>
    </div>
  </div>

  <!-- CONTACT MODAL -->
  <div class="modal-overlay" id="contact-modal" style="display: none;">
    <div class="modal-content modal-lg">
      <button class="modal-close" onclick="document.getElementById('contact-modal').style.display='none'">&times;</button>
      <h2 class="modal-title">Contact Us</h2>
      <p class="modal-subtitle">We would love to hear from you.</p>
      <div id="contact-body">
        <p class="panel-note">Loading...</p>
      </div>
    </div>
  </div>

  <script src="/shared/js/theme.js?v=2"></script>
  <script type="module" src="/assets/js/main.js?v=59"></script>
  <script>
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    // Referral capture: a guest arriving via /?ref=CODE keeps the code so the
    // signup flow can attribute them to the referrer. Same-origin localStorage
    // carries it into auth.html (whether opened directly or in the slide-over).
    (function () {
      try {
        const ref = new URLSearchParams(window.location.search).get('ref');
        if (ref) localStorage.setItem('gliimu_ref', ref.trim().toUpperCase());
      } catch (e) {}
    })();
  </script>
</body>
</html>
